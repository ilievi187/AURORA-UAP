name: Language gate keyboard quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --only-shell chromium
      - name: Test mandatory and optional gate keyboard focus
        run: node --test tests/tera-gate-focus-browser.test.mjs
