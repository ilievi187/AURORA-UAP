name: Airspace request ordering quality
on:
  pull_request:
    paths:
      - 'sky.*'
      - 'subpage-i18n.js'
      - 'tests/tera-sky-browser.test.mjs'
      - '.github/workflows/tera-sky-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sky.*'
      - 'subpage-i18n.js'
      - 'tests/tera-sky-browser.test.mjs'
      - '.github/workflows/tera-sky-tests.yml'
permissions:
  contents: read
jobs:
  sky-request-order:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --only-shell chromium
      - name: Test airspace request ordering in isolated Chromium
        run: node --test tests/tera-sky-browser.test.mjs
