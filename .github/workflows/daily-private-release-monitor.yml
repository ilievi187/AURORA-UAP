name: AURORA public-report privacy boundary monitor

on:
  schedule:
    - cron: '42 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-report-privacy-boundary-monitor
  cancel-in-progress: false

jobs:
  read-only-security-monitor:
    name: Daily anonymous security and intake-profile proof
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      AURORA_RELEASE_MONITOR_PROFILE: ${{ vars.AURORA_RELEASE_MONITOR_PROFILE || 'prelaunch' }}
    steps:
      - name: Get site source
        uses: actions/checkout@v4
      - name: Setup Node.js (no private credentials)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate monitoring logic offline
        run: node --test tests/private-release-readiness.test.mjs
      - name: Verify anonymous access boundary on live production
        run: node scripts/check-private-release-readiness.mjs --live --profile="$AURORA_RELEASE_MONITOR_PROFILE"
