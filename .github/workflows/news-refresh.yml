name: AURORA scheduled news cache refresh
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-public-news:
    if: github.repository == 'ilievi187/AURORA-UAP'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh source-backed public editions
        shell: bash
        run: |
          set -euo pipefail
          for edition in global bulgaria official; do
            response="$(curl --fail --silent --show-error --retry 1 --retry-all-errors --max-time 25 \
              "https://aurorauap.org/api/news?edition=${edition}&lang=en")"
            NEWS_EDITION="$edition" NEWS_RESPONSE="$response" node --input-type=module -e '
              const payload = JSON.parse(process.env.NEWS_RESPONSE);
              if (payload.edition !== process.env.NEWS_EDITION) throw new Error("edition mismatch");
              if (!["live", "cached"].includes(payload.status)) throw new Error("news status unavailable");
              if (!Array.isArray(payload.items) || payload.items.length < 1) throw new Error("no source-backed items");
              for (const item of payload.items) {
                const url = new URL(item.url);
                if (url.protocol !== "https:" || !item.title?.trim() || !item.source?.trim() || !Number.isFinite(Date.parse(item.published)))
                  throw new Error("item missing title, publisher, HTTPS source, or publication date");
              }
              console.log(`${payload.edition}: ${payload.items.length} dated, attributed items (${payload.status})`);
            '
          done
