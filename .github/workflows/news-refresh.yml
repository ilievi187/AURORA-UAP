name: AURORA scheduled news archive refresh
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-source-backed-history:
    if: github.repository == 'ilievi187/AURORA-UAP' && vars.AURORA_NEWS_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AURORA_NEWS_REFRESH_TOKEN: ${{ secrets.AURORA_NEWS_REFRESH_TOKEN }}
    steps:
      - name: Require enabled refresh secret before any request
        shell: bash
        run: |
          if [[ -z "${AURORA_NEWS_REFRESH_TOKEN:-}" ]]; then
            echo "::error::Durable news refresh is opted in but AURORA_NEWS_REFRESH_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
      - name: Refresh source-backed editions into durable D1 history
        shell: bash
        run: |
          set -euo pipefail
          for edition in global bulgaria official; do
            response="$(curl --fail --silent --show-error --retry 1 --retry-all-errors --max-time 60 \
              --request POST \
              --header "Authorization: Bearer ${AURORA_NEWS_REFRESH_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{\"edition\":\"${edition}\"}" \
              "https://aurorauap.org/api/news-refresh")"
            NEWS_EDITION="$edition" NEWS_RESPONSE="$response" node --input-type=module -e '
              const payload = JSON.parse(process.env.NEWS_RESPONSE);
              if (payload.status !== "refreshed" || payload.edition !== process.env.NEWS_EDITION)
                throw new Error("durable refresh did not complete for the requested edition");
              if (!Number.isInteger(payload.fetched_count) || payload.fetched_count < 5 ||
                  !Number.isInteger(payload.stored_count) || payload.stored_count < 1 ||
                  payload.stored_count > payload.fetched_count)
                throw new Error("durable refresh returned invalid source-backed counts");
              console.log(`${payload.edition}: archived ${payload.stored_count} of ${payload.fetched_count} source-backed headlines`);
            '
          done

  refresh-public-snapshot:
    # No private secrets, database writes, or visitor request budget required.
    if: github.repository == 'ilievi187/AURORA-UAP'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    concurrency:
      group: aurora-public-news-snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate collector and snapshot safety offline
        run: node --test tests/public-news-snapshot.test.mjs
      - name: Fetch source-backed headlines and validate the replacement
        run: node scripts/update-public-news-snapshot.mjs
      - name: Publish the dated feed snapshot in the public site
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/news-last-good.json; then
            echo 'News snapshot unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news-last-good.json
          git commit -m 'data(news): refresh dated source-backed headline snapshot'
          git push origin HEAD:main
