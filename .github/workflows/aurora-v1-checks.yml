name: AURORA V1 quality gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTML, JavaScript and accessibility smoke
        run: node --test tests/aurora-v1.test.mjs tests/archive-records.test.mjs tests/auto-archive-sync.test.mjs tests/retired-aircraft-radar.test.mjs tests/archive-pagination-playable.test.mjs tests/archive-cache-freshness.test.mjs tests/inline-video-thumbnails.test.mjs tests/approximate-case-geography.test.mjs tests/design-system.test.mjs tests/aurora-odyssey.test.mjs
  live-public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sourced RSS headlines, failure handling and non-fake offline responses
        run: node --test tests/live-feeds.test.mjs
  pages-function-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Cloudflare Pages Functions exactly as deployment does
        run: npx --yes wrangler@4 pages functions build functions --outfile /tmp/aurora-pages-functions.mjs
  database-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrations, idempotent import and real SQLite API tests
        run: node --experimental-sqlite --test tests/database.test.mjs
  private-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test quarantined text intake, Turnstile verification and private moderation
        run: node --experimental-sqlite --test tests/intake.test.mjs
  deployment-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production D1 release gate and Wrangler seed format
        run: node --experimental-sqlite --test tests/deployment-gate.test.mjs
  d1-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate guarded D1 operation and manual-only workflow
        run: node --test tests/d1-ops.test.mjs
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          # Download only Playwright's headless Chromium shell; system apt upgrades routinely exceed the 12-minute job limit.
          npx playwright install --only-shell chromium
      - name: Test real Canvas animation, gate, Continue and mobile behavior
        run: node --experimental-sqlite --test tests/aurora-browser.test.mjs
      - name: Save real Chromium visual frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-silence-visuals
          path: artifacts/aurora-silence-*.png
          if-no-files-found: ignore
          retention-days: 7
