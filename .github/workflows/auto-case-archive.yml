name: AURORA automatic licensed case archive
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-open-case-archive.mjs'
      - '.github/workflows/auto-case-archive.yml'
  pull_request:
    paths:
      - 'scripts/sync-open-case-archive.mjs'
      - '.github/workflows/auto-case-archive.yml'
  schedule:
    - cron: '17 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurora-automated-case-archive
  cancel-in-progress: false
jobs:
  validate-licensed-case-data:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test archive workflow publication safety
        run: node --test tests/archive-workflow-safety.test.mjs
      - name: Test archive importer using deterministic offline fixtures
        run: node --test tests/archive-records.test.mjs tests/auto-archive-sync.test.mjs
      - name: Validate live import in an isolated temporary copy without publication
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/scripts" "$tmp/data"
          cp scripts/sync-open-case-archive.mjs "$tmp/scripts/"
          cp data/cases.json "$tmp/data/"
          node "$tmp/scripts/sync-open-case-archive.mjs"
          node -e 'const a=JSON.parse(require("node:fs").readFileSync(process.argv[1])); const m=JSON.parse(require("node:fs").readFileSync(process.argv[2])); if(a.cases.length!==m.total||m.status!=="ok") process.exit(1); console.log(JSON.stringify(m))' "$tmp/data/cases.json" "$tmp/data/archive-sync-status.json"
          test ! -e "$tmp/.git"
      - name: Validate updated archive and static site contracts
        run: |
          node --test tests/aurora-v1.test.mjs tests/archive-records.test.mjs
          git diff --check

  publish-scheduled-main-archive:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'ilievi187/AURORA-UAP'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test archive importer using deterministic offline fixtures
        run: node --test tests/archive-records.test.mjs tests/auto-archive-sync.test.mjs
      - name: Fetch only approved, attributed case dataset
        run: node scripts/sync-open-case-archive.mjs
      - name: Validate updated archive and static site contracts
        run: |
          node --test tests/aurora-v1.test.mjs tests/archive-records.test.mjs tests/auto-archive-sync.test.mjs
          git diff --check
      - name: Commit verified archive snapshot
        run: |
          git add data/cases.json data/archive-sync-status.json
          if git diff --cached --quiet; then
            echo "No source changes; no archive update PR needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(archive): refresh attributed open UAP case records"
      - name: Push bot branch and open or update one archive PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/archive-sync
          branch_ref="refs/heads/$branch"
          remote_ref="refs/remotes/origin/$branch"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "$branch_ref:$remote_ref"
            expected="$(git rev-parse "$remote_ref")"
          else
            expected=""
          fi
          git push "--force-with-lease=$branch_ref:$expected" origin "HEAD:$branch_ref"

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$GITHUB_REPOSITORY_OWNER:$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "data(archive): refresh attributed open UAP case records" --body "Automated proposal from the licensed archive synchronizer. Data changes retain source provenance and deduplication; no data is published to main until this PR is reviewed and merged."
            echo "Updated existing archive PR #$existing"
          else
            closed="$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed --base main --head "$GITHUB_REPOSITORY_OWNER:$branch" --json number,mergedAt --jq '.[0] | if . then "\(.number)\t\(.mergedAt // empty)" else empty end')"
            if [ -n "$closed" ]; then
              IFS=$'\t' read -r closed_number merged_at <<< "$closed"
              if [ -z "$merged_at" ]; then
                echo "Archive update PR #$closed_number is closed but unmerged; refusing to create a duplicate. Reopen it before the next scheduled update."
                exit 1
              fi
              echo "Previous archive update PR #$closed_number is merged; a new update PR is needed."
            fi
            gh pr create --draft --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "data(archive): refresh attributed open UAP case records" --body "Automated proposal from the licensed archive synchronizer. Data changes retain source provenance and deduplication; no data is published to main until this PR is reviewed and merged."
          fi
