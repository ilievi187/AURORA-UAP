name: AURORA automatic licensed case archive
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-open-case-archive.mjs'
      - 'scripts/source-case-annotations.mjs'
      - 'data/source-case-annotations.json'
      - 'scripts/sync-disclosure-zone.mjs'
      - 'scripts/disclosure-zone-editorial-annotations.mjs'
      - 'data/disclosure-zone-editorial-annotations.json'
      - 'scripts/approximate-case-geography.mjs'
      - 'tests/archive-workflow-safety.test.mjs'
      - 'tests/approximate-case-geography.test.mjs'
      - 'tests/disclosure-zone-sync.test.mjs'
      - 'tests/disclosure-zone-editorial-annotations.test.mjs'
      - '.github/workflows/auto-case-archive.yml'
  pull_request:
    paths:
      - 'scripts/sync-open-case-archive.mjs'
      - 'scripts/source-case-annotations.mjs'
      - 'data/source-case-annotations.json'
      - 'scripts/sync-disclosure-zone.mjs'
      - 'scripts/disclosure-zone-editorial-annotations.mjs'
      - 'data/disclosure-zone-editorial-annotations.json'
      - 'tests/archive-workflow-safety.test.mjs'
      - 'tests/disclosure-zone-sync.test.mjs'
      - 'tests/disclosure-zone-editorial-annotations.test.mjs'
      - '.github/workflows/auto-case-archive.yml'
  schedule:
    - cron: '17 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurora-automated-case-archive
  cancel-in-progress: false
jobs:
  validate-licensed-case-data:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test archive workflow publication safety
        run: node --test tests/archive-workflow-safety.test.mjs
      - name: Test archive importer using deterministic offline fixtures
        run: node --test tests/archive-records.test.mjs tests/auto-archive-sync.test.mjs tests/disclosure-zone-sync.test.mjs tests/disclosure-zone-editorial-annotations.test.mjs tests/approximate-case-geography.test.mjs
      - name: Validate live import in an isolated temporary copy without publication
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/scripts" "$tmp/data"
          cp scripts/sync-open-case-archive.mjs "$tmp/scripts/"
          cp scripts/sync-disclosure-zone.mjs "$tmp/scripts/"
          cp scripts/disclosure-zone-editorial-annotations.mjs "$tmp/scripts/"
          cp scripts/approximate-case-geography.mjs "$tmp/scripts/"
          cp scripts/source-case-annotations.mjs "$tmp/scripts/"
          cp data/source-case-annotations.json "$tmp/data/"
          cp data/disclosure-zone-editorial-annotations.json "$tmp/data/"
          cp media-player.js package.json "$tmp/"
          cp data/cases.json "$tmp/data/"
          node "$tmp/scripts/sync-open-case-archive.mjs"
          node "$tmp/scripts/sync-disclosure-zone.mjs"
          node --input-type=module - "$tmp/data/cases.json" "$tmp/data/archive-sync-status.json" "$tmp/data/disclosure-zone-sync-status.json" "$tmp/data/disclosure-zone-editorial-annotations.json" <<'NODE'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const [archivePath,firstPath,secondPath,editorialPath]=process.argv.slice(2);
          const archive=JSON.parse(readFileSync(archivePath,"utf8"));
          const first=JSON.parse(readFileSync(firstPath,"utf8"));
          const second=JSON.parse(readFileSync(secondPath,"utf8"));
          const editorial=JSON.parse(readFileSync(editorialPath,"utf8"));
          assert.equal(archive.cases.length,second.total);
          assert.equal(first.status,"ok");
          assert.equal(second.status,"ok");
          assert.ok(second.generated>=1);
          const annotations=Object.entries(editorial.records);
          assert.ok(annotations.length>0,"editorial sidecar must not be empty");
          for(const [sourceId,note] of annotations){
            const record=archive.cases.find(item=>item.id==="disclosure-"+sourceId);
            assert.ok(record,"missing imported editorial record: "+sourceId);
            assert.equal(record.provenance?.source_url,"https://disclosure.zone/api/cases.json");
            assert.equal(record.title?.bg,note.title_bg,sourceId+" BG title drifted");
            assert.equal(record.summary?.bg,note.summary_bg,sourceId+" BG summary drifted");
            assert.deepEqual(record.story?.bg,note.story_bg,sourceId+" BG story drifted");
            if(note.story_en)assert.deepEqual(record.story?.en,note.story_en,sourceId+" EN story drifted");
            else assert.ok(Array.isArray(record.story?.en)&&record.story.en.length>=3,sourceId+" licensed EN story was lost");
            assert.deepEqual(record.editorial_review?.source_access_note,note.source_access_note||editorial.source_access_notice,sourceId+" access notice drifted");
            assert.equal(record.editorial_review?.reviewed_at,note.reviewed_at||editorial.reviewed_at,sourceId+" editorial review date drifted");
            if(note.existing_editorial_review)assert.equal(record.editorial_review?.existing_editorial_review,note.existing_editorial_review,sourceId+" prior editorial-review note was lost");
            if(note.references.length===0)assert.equal(record.source?.url,"https://disclosure.zone/cases/"+sourceId,sourceId+" licensed publisher source was changed");
            assert.equal(record.content_depth,"source-reviewed",sourceId+" editorial status missing");
            for(const ref of note.references)assert.ok(record.sources?.some(item=>item.url===ref.url),sourceId+" missing editorial reference: "+ref.url);
          }
          console.log(JSON.stringify({first,second,editorial_annotations_applied:annotations.length},null,2));
          NODE
          test ! -e "$tmp/.git"

      - name: Validate updated archive and static site contracts
        run: |
          node --test tests/aurora-v1.test.mjs tests/archive-records.test.mjs tests/disclosure-zone-sync.test.mjs tests/disclosure-zone-editorial-annotations.test.mjs tests/approximate-case-geography.test.mjs
          git diff --check

  publish-scheduled-main-archive:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'ilievi187/AURORA-UAP' && vars.AURORA_ARCHIVE_PR_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test archive importer using deterministic offline fixtures
        run: node --test tests/archive-records.test.mjs tests/auto-archive-sync.test.mjs tests/disclosure-zone-sync.test.mjs tests/disclosure-zone-editorial-annotations.test.mjs tests/approximate-case-geography.test.mjs
      - name: Fetch approved, attributed first case dataset
        run: node scripts/sync-open-case-archive.mjs
      - name: Fetch CC BY worldwide case metadata without publishing private reports
        run: node scripts/sync-disclosure-zone.mjs
      - name: Validate updated archive and static site contracts
        run: |
          node --test tests/aurora-v1.test.mjs tests/archive-records.test.mjs tests/disclosure-zone-sync.test.mjs tests/disclosure-zone-editorial-annotations.test.mjs tests/approximate-case-geography.test.mjs tests/auto-archive-sync.test.mjs
          git diff --check
      - name: Commit verified archive snapshot
        run: |
          git add data/cases.json data/archive-sync-status.json data/disclosure-zone-sync-status.json
          if git diff --cached --quiet; then
            echo "No source changes; no archive update PR needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(archive): refresh attributed open UAP case records"
      - name: Push bot branch and open or update one archive PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/archive-sync
          branch_ref="refs/heads/$branch"
          remote_ref="refs/remotes/origin/$branch"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "$branch_ref:$remote_ref"
            expected="$(git rev-parse "$remote_ref")"
          else
            expected=""
          fi
          git push "--force-with-lease=$branch_ref:$expected" origin "HEAD:$branch_ref"

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$GITHUB_REPOSITORY_OWNER:$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "data(archive): refresh attributed open UAP case records" --body "Automated proposal from the licensed archive synchronizer. Data changes retain source provenance and deduplication; no data is published to main until this PR is reviewed and merged."
            echo "Updated existing archive PR #$existing"
          else
            closed="$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed --base main --head "$GITHUB_REPOSITORY_OWNER:$branch" --json number,mergedAt --jq '.[0] | if . then "\(.number)\t\(.mergedAt // empty)" else empty end')"
            if [ -n "$closed" ]; then
              IFS=$'\t' read -r closed_number merged_at <<< "$closed"
              if [ -z "$merged_at" ]; then
                echo "Archive update PR #$closed_number is closed but unmerged; refusing to create a duplicate. Reopen it before the next scheduled update."
                exit 1
              fi
              echo "Previous archive update PR #$closed_number is merged; a new update PR is needed."
            fi
            gh pr create --draft --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "data(archive): refresh attributed open UAP case records" --body "Automated proposal from the licensed archive synchronizer. Data changes retain source provenance and deduplication; no data is published to main until this PR is reviewed and merged."
          fi
          gh workflow run aurora-v1-checks.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
