name: Donation page browser quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  donation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --only-shell chromium
      - name: Test checkout URL validation and donation browser states
        run: node --test tests/donation-checkout.test.mjs tests/tera-donation-browser.test.mjs
