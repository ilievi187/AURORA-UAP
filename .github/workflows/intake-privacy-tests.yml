      - 'tests/private-release-readiness.test.mjs'
      - 'scripts/check-private-release-readiness.mjs'
      - 'docs/RELEASE-SECURITY-EVIDENCE-2026-11-03.md'
      - 'docs/WAF-TURNSTILE-EMERGENCY-RUNBOOK-2026-11-04.md'
      - 'docs/LAUNCH-READINESS-2026-11-04.md'
      - 'scripts/backup-d1-drive.sh'
      - 'scripts/setup-backup-cloudflare-token.sh'
      - 'docs/BACKUP-UNATTENDED-CLOUDFLARE-AUTH-2026-11-04.md'
      - 'deploy/systemd/aurora-d1-backup.service'
      - 'deploy/systemd/aurora-d1-backup.timer'
      - 'docs/GOOGLE-DRIVE-BACKUP-SETUP-2026-11-03.md'
      - 'docs/BACKUP-RECOVERY-PRIVACY-2026-11-03.md'
      - '.github/workflows/intake-privacy-tests.yml'
jobs:
  privacy-and-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:report-auth
      - run: git diff --exit-code -- report-auth.bundle.js
      - run: node --test tests/privacy-route.test.mjs tests/private-release-readiness.test.mjs
      - run: node --experimental-sqlite --test tests/intake.test.mjs tests/workers-fetch-redirect-compat.test.mjs tests/reporter-auth.test.mjs tests/account-privacy.test.mjs tests/intake-auth-gate.test.mjs tests/isolated-intake-security.test.mjs tests/report-to-moderation-journey.test.mjs tests/moderation.test.mjs tests/access-denial-matrix.test.mjs tests/privacy-retention.test.mjs tests/privacy-account-ledger-coverage.test.mjs tests/backup-recovery.test.mjs tests/privacy-restore-guard.test.mjs tests/privacy-auth-restore-rehearsal.test.mjs tests/backup-drive.test.mjs
