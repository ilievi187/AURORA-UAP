name: Intake privacy and quarantine checks
on:
  push:
    branches: [main]
    paths:
      - 'privacy.html'
      - '_redirects'
      - 'functions/api/intake/**'
      - 'functions/api/account/**'
      - 'functions/api/moderation/**'
      - 'moderation.html'
      - 'assets/turnstile-diagnostic.js'
      - 'docs/OWNER-TURNSTILE-DIAGNOSTIC-2026-11-04.md'
      - 'functions/_lib/intake.js'
      - 'functions/_lib/reporter-auth.js'
      - 'migrations/0005_reporter_ownership.sql'
      - 'report-auth.entry.js'
      - 'report-auth.bundle.js'
      - 'report.html'
      - 'report.js'
      - 'tests/reporter-auth.test.mjs'
      - 'tests/account-privacy.test.mjs'
      - 'docs/ACCOUNT-PRIVACY-OPERATIONS-2026-11-04.md'
      - 'tests/intake-auth-gate.test.mjs'
      - 'tests/isolated-intake-security.test.mjs'
      - 'tests/workers-fetch-redirect-compat.test.mjs'
      - 'scripts/turnstile-dummy-smoke.mjs'
      - 'docs/ISOLATED-INTAKE-SECURITY-QA-2026-11-03.md'
      - 'worker/privacy-retention.js'
      - 'tests/privacy-route.test.mjs'
      - 'tests/intake.test.mjs'
      - 'tests/moderation.test.mjs'
      - 'tests/privacy-retention.test.mjs'
      - 'tests/backup-recovery.test.mjs'
      - 'tests/backup-drive.test.mjs'
      - 'tests/private-release-readiness.test.mjs'
      - 'scripts/check-private-release-readiness.mjs'
      - 'docs/RELEASE-SECURITY-EVIDENCE-2026-11-03.md'
      - 'docs/WAF-TURNSTILE-EMERGENCY-RUNBOOK-2026-11-04.md'
      - 'docs/LAUNCH-READINESS-2026-11-04.md'
      - 'scripts/backup-d1-drive.sh'
      - 'deploy/systemd/aurora-d1-backup.service'
      - 'deploy/systemd/aurora-d1-backup.timer'
      - 'docs/GOOGLE-DRIVE-BACKUP-SETUP-2026-11-03.md'
      - 'docs/BACKUP-RECOVERY-PRIVACY-2026-11-03.md'
      - '.github/workflows/intake-privacy-tests.yml'
  pull_request:
    paths:
      - 'privacy.html'
      - '_redirects'
      - 'functions/api/intake/**'
      - 'functions/api/account/**'
      - 'functions/api/moderation/**'
      - 'moderation.html'
      - 'assets/turnstile-diagnostic.js'
      - 'docs/OWNER-TURNSTILE-DIAGNOSTIC-2026-11-04.md'
      - 'functions/_lib/intake.js'
      - 'functions/_lib/reporter-auth.js'
      - 'migrations/0005_reporter_ownership.sql'
      - 'report-auth.entry.js'
      - 'report-auth.bundle.js'
      - 'report.html'
      - 'report.js'
      - 'tests/reporter-auth.test.mjs'
      - 'tests/account-privacy.test.mjs'
      - 'docs/ACCOUNT-PRIVACY-OPERATIONS-2026-11-04.md'
      - 'tests/intake-auth-gate.test.mjs'
      - 'tests/isolated-intake-security.test.mjs'
      - 'tests/workers-fetch-redirect-compat.test.mjs'
      - 'scripts/turnstile-dummy-smoke.mjs'
      - 'docs/ISOLATED-INTAKE-SECURITY-QA-2026-11-03.md'
      - 'worker/privacy-retention.js'
      - 'tests/privacy-route.test.mjs'
      - 'tests/intake.test.mjs'
      - 'tests/moderation.test.mjs'
      - 'tests/privacy-retention.test.mjs'
      - 'tests/backup-recovery.test.mjs'
      - 'tests/backup-drive.test.mjs'
      - 'tests/private-release-readiness.test.mjs'
      - 'scripts/check-private-release-readiness.mjs'
      - 'docs/RELEASE-SECURITY-EVIDENCE-2026-11-03.md'
      - 'docs/WAF-TURNSTILE-EMERGENCY-RUNBOOK-2026-11-04.md'
      - 'docs/LAUNCH-READINESS-2026-11-04.md'
      - 'scripts/backup-d1-drive.sh'
      - 'deploy/systemd/aurora-d1-backup.service'
      - 'deploy/systemd/aurora-d1-backup.timer'
      - 'docs/GOOGLE-DRIVE-BACKUP-SETUP-2026-11-03.md'
      - 'docs/BACKUP-RECOVERY-PRIVACY-2026-11-03.md'
      - '.github/workflows/intake-privacy-tests.yml'
jobs:
  privacy-and-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:report-auth
      - run: git diff --exit-code -- report-auth.bundle.js
      - run: node --test tests/privacy-route.test.mjs tests/private-release-readiness.test.mjs
      - run: node --experimental-sqlite --test tests/intake.test.mjs tests/workers-fetch-redirect-compat.test.mjs tests/reporter-auth.test.mjs tests/account-privacy.test.mjs tests/intake-auth-gate.test.mjs tests/isolated-intake-security.test.mjs tests/moderation.test.mjs tests/privacy-retention.test.mjs tests/backup-recovery.test.mjs tests/backup-drive.test.mjs
