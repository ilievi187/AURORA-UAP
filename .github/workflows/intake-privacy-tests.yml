      - 'worker/privacy-retention.js'
      - 'tests/privacy-route.test.mjs'
      - 'tests/intake.test.mjs'
      - 'tests/moderation.test.mjs'
      - 'tests/access-denial-matrix.test.mjs'
      - 'docs/ACCESS-NEGATIVE-IDENTITY-AUDIT-2026-11-04.md'
      - 'docs/ACCESS-ROLLOUT-2026-11-02.md'
      - 'tests/privacy-retention.test.mjs'
      - 'tests/privacy-account-ledger-coverage.test.mjs'
      - 'docs/PRIVATE-ACCOUNT-LEDGER-COVERAGE-2026-11-04.md'
      - 'tests/backup-recovery.test.mjs'
      - 'tests/privacy-restore-guard.test.mjs'
      - 'tests/privacy-auth-restore-rehearsal.test.mjs'
      - 'docs/AUTH-ERASURE-ISOLATED-RESTORE-REHEARSAL-2026-11-04.md'
      - 'worker/privacy-restore-guard.js'
      - 'worker/privacy-rights.js'
      - 'docs/PRIVATE-RESTORE-ERASURE-GUARD-2026-11-04.md'
